name: Sync today's venues

# 本日発売中の開催場名一覧だけを取得してTursoにキャッシュする軽量ジョブ。
# Next.jsアプリ（Vercel）の「新しいレースを取得」フォームの選択肢を
# 「本日実際に開催している場」だけに絞るために使う。
# レース本体のスクレイピング（scrape.yml）よりずっと軽い（ページ1枚読むだけ）。
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 3,9 * * *"  # 例: 朝と昼に1回ずつ。有効化する場合も低頻度を維持する

jobs:
  sync-venues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Sync venues
        working-directory: scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python keirin_scraper.py --sync-venues
