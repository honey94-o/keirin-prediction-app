name: Scrape keirin race data

# 手動実行（workflow_dispatch）を基本とする。Next.jsアプリの「レース取得」画面から
# GitHub APIでこのワークフローをトリガーする（lib/actions.ts の triggerScrapeAction）。
# スケジュール実行はデフォルトで無効にしている（下のcronはコメントアウト）。
# 有効化する場合も、KEIRIN.JPへの節度あるアクセス（低頻度・個人利用の範囲）を
# 必ず維持すること。全開催場×全レースを高頻度に回すような使い方はしない。
on:
  workflow_dispatch:
    inputs:
      venue_name:
        description: "開催場名（例: 京王閣）"
        required: true
      race_no:
        description: "レース番号"
        required: true
        default: "1"
  # schedule:
  #   - cron: "0 */3 * * *"  # 例: 3時間おき。有効化する場合はrace1のみ・節度を保つこと

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python keirin_scraper.py --venue-name "${{ github.event.inputs.venue_name }}" --race-no "${{ github.event.inputs.race_no }}"
