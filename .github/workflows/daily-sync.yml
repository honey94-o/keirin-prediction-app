name: Daily sync all venues

# 全43開催場の直近レース（当日カード＋前日分の結果確定）を自動取得する。
# WINTICKET版スクレイパー（winticket_scraper.py）はPlaywright不要（requests/BeautifulSoup
# のみ）のため、Playwrightのインストールは行わずスケジュール実行できる。
# 個人利用の範囲内で低頻度（1日4回）を維持する：
#   - 朝（JST 5時着地）：当日の出走表・オッズを発走前に取得。この実行時のみ、
#     結果が出揃った前日分のpredictionsを保存し予想精度サマリーも計算する
#     （scripts/daily-summary.ts。/history画面の「前日サマリー」に表示）
#   - 10時・15時：日中の並び予想・オッズ更新を反映
#   - 19時：ミッドナイト競輪（21時以降発走、ほぼ毎日開催・1日あたり20件前後と
#     全体の3割近くを占める）の並び予想が夕方までに固まりきらないことがあるため、
#     発走前に間に合うタイミングで厳選・バリカタを計算し直す
# （元は1日2回だったが、ミッドナイトの並び予想が古いまま選定されてしまう問題を
#  解消するため4回に増やした。頻度が過剰と分かれば減らす）。
#
# 【cronの時刻＝実際に走る時刻ではない】
# GitHub Actionsのscheduleはベストエフォートで、このリポジトリの実測では
# +64〜211分（中央値125分）遅れて起動する。またGitHubは混雑する毎時0分を
# 避けるよう推奨している。そのため以下は「狙った着地時刻から約2時間前倒し」かつ
# 「:00を外した分」を指定している。cronの数字を素直に読むとズレて見えるが意図的。
#   05:00着地 ← 18:23 UTC (=JST 3:23 予定) → 遅延込みで JST 4:30〜7:00 に着地（実測済み）
#   10:00着地 ← 23:37 UTC (=JST 8:37 予定、前日UTC日付になる点に注意)
#   15:00着地 ← 04:41 UTC (=JST 13:41 予定)
#   19:00着地 ← 08:17 UTC (=JST 17:17 予定)
# 10時・15時・19時ぶんはまだ実測していない見積もりなので、実際の着地が想定と
# ズレるようなら数字を調整すること。
# なお前倒し後もUTC日付は変わらないため、スクレイパーの --days-back の
# 対象範囲（date.today() 基準）は従来と同じ。
on:
  # 手動実行時だけ遡る日数を指定できる。同期失敗やクォータ枯渇で結果を取り逃した
  # 期間を埋め戻すための入口（自動実行は従来どおり1日分のみ）。スクレイパー側の
  # --days-back は「今日からN日前まで」を対象にする。
  workflow_dispatch:
    inputs:
      days_back:
        description: "何日前まで遡るか（埋め戻し時のみ増やす。全43開催場×日数ぶんアクセスするため、常用せず節度を保つこと）"
        required: false
        default: "1"
      run_summary:
        description: "前日サマリーも再計算するか（通常は朝の定期実行だけで十分）"
        required: false
        default: "false"
  schedule:
    - cron: "23 18 * * *"  # 予定JST 3:23 → 遅延込みで朝5時着地
    - cron: "37 23 * * *"  # 予定JST 8:37 → 遅延込みで10時着地
    - cron: "41 4 * * *"   # 予定JST 13:41 → 遅延込みで15時着地
    - cron: "17 8 * * *"   # 予定JST 17:17 → 遅延込みで19時着地（ミッドナイト対策）

jobs:
  sync:
    runs-on: ubuntu-latest
    # 遅延次第では前の回とタイミングが近づきうるため、万一重なっても同時実行は
    # させず後続をキューイングする（DB書き込みの競合や無駄な二重実行を避ける）。
    concurrency:
      group: daily-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Nodeの依存（約15秒）はスクレイピング（数十秒〜）と並行してバックグラウンドで
      # 入れ、ピック計算の直前で完了を待つ（直列だとその分だけ毎回遅くなる）。
      - name: Install Node dependencies (background)
        run: |
          (npm ci --no-audit --no-fund --prefer-offline > "$RUNNER_TEMP/npm-ci.log" 2>&1; echo $? > "$RUNNER_TEMP/npm-ci.exit") &

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Scrape all venues (recent days)
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # scheduleイベントでは github.event.inputs が空になるため 1 にフォールバックする。
          # -u: 標準出力をバッファリングしない（ブロックバッファのままだと進捗ログが
          # 途中経過として見えず、ハングと区別がつかなくなるため）。
          python -u winticket_scraper.py --all-venues --days-back ${{ github.event.inputs.days_back || '1' }}

      - name: Wait for Node dependencies
        run: |
          for i in $(seq 1 600); do [ -f "$RUNNER_TEMP/npm-ci.exit" ] && break; sleep 1; done
          tail -5 "$RUNNER_TEMP/npm-ci.log"
          exit "$(cat "$RUNNER_TEMP/npm-ci.exit" 2>/dev/null || echo 1)"

      # 当日・翌日の厳選・バリカタ・中穴候補は日中のオッズ・並び予想更新も
      # 反映したいので、全実行（朝・日中・夜・手動リフレッシュ）で計算し直す。
      # 元はdaily-picks.ts/barikata-picks.tsの2ステップだったが、どちらも同じ
      # レース群にpredictRaceを独立に呼んでおり計算が重複していたため
      # （データ更新の高速化調査、2026-09）、1本のscripts/compute-picks.tsに統合した。
      # 前日サマリーより先に実行し、ピックを先に画面へ出す。
      - name: Compute today's/tomorrow's picks (厳選/バリカタ/中穴候補)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/compute-picks.ts

      # 前日サマリー集計は1日1回（朝、前日分の結果が出揃った後）だけでよい。
      # 以前は手動実行（アプリの「今すぐ更新」ボタン含む）のたびにも走り、
      # 毎回約10分とNeonの転送量を余計に使っていたため、手動時は明示指定のみにする
      # （2026-10に保存済みの予想を計算し直さないよう直し、数秒〜数十秒になった）。
      # ★ここは上の schedule の cron 文字列と完全一致で比較している。cronを変えたら
      #   必ずこの文字列も合わせること。不一致だと条件が永久に偽になり、前日サマリーが
      #   スケジュール実行で一切走らなくなる（エラーも出ないので気付きにくい）。
      - name: Compute previous day's summary
        if: github.event.inputs.run_summary == 'true' || github.event.schedule == '23 18 * * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/daily-summary.ts

      # アプリの画面用キャッシュ（lib/cache.ts）を即時失効させ、取得したデータを
      # すぐ画面に出す。途中のステップが失敗しても保存済み分は反映したいのでalways()。
      # 失敗してもアプリ側の保険（10分で自動更新）があるのでジョブは失敗させない。
      - name: Refresh app cache
        if: always()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST "https://keirin-prediction-app.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" -H "Content-Type: application/json" \
            -d '{"tags":["races","results","picks"]}' || echo "警告: キャッシュ失効に失敗（10分以内に自動更新される）"
          # 失効直後の最初の表示はページの作り直しを待つ（1〜2.6秒）ため、よく開くページを
          # ここで先に作り直しておく（暖機）。ユーザーが開く時にはキャッシュ済みになる。
          # 失効が全体に行き渡る前に開くと古いキャッシュを受け取るだけなので少し待つ。
          sleep 5
          curl -s -o /dev/null "https://keirin-prediction-app.vercel.app/" || true
          curl -s -o /dev/null "https://keirin-prediction-app.vercel.app/picks" || true
          curl -s -o /dev/null "https://keirin-prediction-app.vercel.app/history" || true
