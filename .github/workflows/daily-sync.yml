name: Daily sync all venues

# 全43開催場の直近レース（当日カード＋前日分の結果確定）を自動取得する。
# WINTICKET版スクレイパー（winticket_scraper.py）はPlaywright不要（requests/BeautifulSoup
# のみ）のため、Playwrightのインストールは行わずスケジュール実行できる。
# 個人利用の範囲内で低頻度（1日2回）を維持する：
#   - 朝（JST 5:00）：当日の出走表・オッズを発走前に取得。この実行時のみ、
#     結果が出揃った前日分のpredictionsを保存し予想精度サマリーも計算する
#     （scripts/daily-summary.ts。/history画面の「前日サマリー」に表示）
#   - 夕方（JST 17:00）：日中に確定したレース結果を取得
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 20 * * *"  # JST 5:00（前日20:00 UTC）
    - cron: "0 8 * * *"   # JST 17:00

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Scrape all venues (recent days)
        working-directory: scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python winticket_scraper.py --all-venues --days-back 1

      # Node系のステップは全実行（朝・夕・手動）で使うため無条件にする。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      # 前日サマリー集計は朝の実行（前日分の結果が出揃った後）だけでよいので、
      # 手動実行時と朝(JST 5:00=UTC20:00)のスケジュールに限定する。
      - name: Compute previous day's summary
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/daily-summary.ts

      # 当日・翌日の厳選レース（◎-対抗スコア差）は日中のオッズ・並び予想更新も
      # 反映したいので、朝・夕・手動リフレッシュの全実行で計算し直す。
      - name: Compute today's/tomorrow's high-confidence picks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/daily-picks.ts
